<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada · Lof Espresso</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2a2a2a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2a2a2a; --paper:#f4efe6; --line:#c9beae; --muted:#6e655c; --lokio:#ff4f17; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    color: var(--ink);
    font: 400 16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(180deg, rgba(244,239,230,0.9), rgba(244,239,230,0.96)),
      url("/assets/texture-cathedral-soft.jpg");
    background-size: auto, cover;
    background-position: center;
  }
  main { max-width: 400px; }
  img { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 16px; background: #fff; box-shadow: 0 0 0 1px var(--line); }
  .n { font-size: 56px; font-weight: 700; margin: 0; letter-spacing: -0.03em; line-height: 1; }
  h1 { font-size: 1.25rem; margin: 8px 0 10px; font-weight: 600; }
  p { margin: 0 0 22px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  a.b {
    display: inline-block; padding: 12px 18px;
    background: var(--ink); color: var(--paper);
    text-decoration: none; font-weight: 600; border-radius: 2px;
  }
  a.g {
    display: inline-block; padding: 12px 18px;
    background: transparent; color: var(--ink);
    border: 1px solid var(--ink); text-decoration: none; font-weight: 600; border-radius: 2px;
  }
  .lokio-sig { margin-top: 28px; font-size: 0.78rem; color: var(--muted); }
  .lokio-sig a { color: inherit; text-decoration: none; }
  .lokio-sig .io { color: var(--lokio); }
</style>
</head>
<body>
<main>
  <img src="/assets/logo-lof-espresso.jpg" width="88" height="88" alt="Lof Espresso">
  <p class="n">404</p>
  <h1>Esta página no está en la carta</h1>
  <p>Vuelve al inicio o revisa los enlaces del local.</p>
  <div class="actions">
    <a class="b" href="/">Ir al inicio</a>
    <a class="g" href="/enlaces/">Enlaces</a>
  </div>
  <p class="lokio-sig"><a href="https://lokio.cl" target="_blank" rel="noopener">Web hecha por lok<span class="io">IO</span></a></p>
</main>
</body>
</html>
